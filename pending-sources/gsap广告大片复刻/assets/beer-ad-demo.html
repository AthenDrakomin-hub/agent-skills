<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精酿啤酒 - 广告大片 Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
    }
    .char {
      display: inline-block;
      will-change: transform, opacity;
    }
    .bottle {
      will-change: transform;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
      will-change: transform;
    }
  </style>
</head>
<body class="page-container">

  <!-- 背景层（最慢视差） -->
  <div class="bg-layer fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-gradient-to-b from-amber-950/40 via-transparent to-amber-900/20"></div>
  </div>

  <!-- ====== HERO 首屏 ====== -->
  <section class="hero-wrap relative h-screen flex items-center justify-center overflow-hidden">
    <!-- 气泡装饰层 -->
    <div class="bubble-layer absolute inset-0 pointer-events-none">
      <div class="bubble w-4 h-4 left-[20%] top-[60%]"></div>
      <div class="bubble w-6 h-6 left-[75%] top-[40%]"></div>
      <div class="bubble w-3 h-3 left-[40%] top-[75%]"></div>
      <div class="bubble w-5 h-5 left-[85%] top-[20%]"></div>
      <div class="bubble w-2 h-2 left-[15%] top-[30%]"></div>
    </div>

    <!-- 产品层（瓶子） -->
    <div class="product-bottle absolute right-[15%] bottom-0 w-[180px] md:w-[260px] bottle">
      <!-- 用 CSS 画的啤酒瓶示意 -->
      <div class="relative">
        <div class="w-full h-[400px] md:h-[550px] mx-auto rounded-t-[60px] rounded-b-2xl bg-gradient-to-b from-amber-400 via-amber-600 to-amber-800 shadow-2xl shadow-amber-500/30">
          <div class="absolute top-[60px] left-1/2 -translate-x-1/2 w-[60%] h-[120px] bg-white/90 rounded flex items-center justify-center">
            <span class="text-amber-800 font-bold text-sm md:text-lg tracking-wider">CRAFT</span>
          </div>
        </div>
        <!-- 瓶盖 -->
        <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-[40%] h-[24px] bg-amber-300 rounded-t-md"></div>
      </div>
    </div>

    <!-- 文字层 -->
    <div class="text-content z-10 text-center px-6">
      <p class="ad-subtitle text-amber-400/80 tracking-[0.5em] text-xs md:text-sm mb-6 uppercase">Craft Brewed</p>
      <h1 class="ad-title text-5xl md:text-8xl font-black leading-tight tracking-tight">
        匠心酿造<br>每一口
      </h1>
      <p class="ad-desc mt-8 text-white/60 text-base md:text-lg max-w-md mx-auto">
        精选麦芽，慢火熬煮，只为呈现最纯粹的风味
      </p>
      <div class="scroll-hint absolute bottom-10 left-1/2 -translate-x-1/2 text-white/40 text-xs tracking-widest">
        向下滚动 ↓
      </div>
    </div>
  </section>

  <!-- ====== 分段1：原料 ====== -->
  <section class="section-block min-h-screen flex items-center px-8 md:px-24">
    <div class="max-w-2xl">
      <p class="text-amber-500/70 text-xs tracking-[0.3em] mb-4 uppercase">01 / Ingredients</p>
      <h2 class="section-title text-4xl md:text-6xl font-bold mb-8">
        精选原料
      </h2>
      <p class="text-white/60 text-lg leading-relaxed">
        从全球甄选优质麦芽与啤酒花，每一粒都经过严格筛选。
        水、麦芽、啤酒花、酵母 —— 四种简单的元素，
        在时间的沉淀下绽放出复杂而迷人的风味层次。
      </p>
    </div>
  </section>

  <!-- ====== 分段2：工艺（产品视差强化） ====== -->
  <section class="section-block relative min-h-screen flex items-center justify-center overflow-hidden">
    <div class="product-item absolute right-[10%] w-[140px] md:w-[200px] bottle opacity-60">
      <div class="w-full h-[300px] md:h-[420px] rounded-t-[50px] rounded-b-xl bg-gradient-to-b from-amber-500/60 to-amber-800/60"></div>
    </div>
    <div class="max-w-2xl px-8 md:px-0 z-10">
      <p class="text-amber-500/70 text-xs tracking-[0.3em] mb-4 uppercase">02 / Process</p>
      <h2 class="section-title text-4xl md:text-6xl font-bold mb-8">
        慢酿工艺
      </h2>
      <p class="text-white/60 text-lg leading-relaxed">
        28天低温发酵，不赶时间，只等风味。
        传统工艺与现代技术的碰撞，让每一滴都恰到好处。
      </p>
    </div>
  </section>

  <!-- ====== 分段3：风味 ====== -->
  <section class="section-block min-h-screen flex items-center px-8 md:px-24">
    <div class="max-w-2xl mx-auto text-center">
      <p class="text-amber-500/70 text-xs tracking-[0.3em] mb-4 uppercase">03 / Flavor</p>
      <h2 class="section-title text-4xl md:text-6xl font-bold mb-8">
        层次丰富
      </h2>
      <div class="grid grid-cols-3 gap-8 mt-16">
        <div class="flavor-item">
          <div class="text-3xl md:text-5xl font-black text-amber-400">苦</div>
          <p class="text-white/50 text-sm mt-2">清爽不涩</p>
        </div>
        <div class="flavor-item">
          <div class="text-3xl md:text-5xl font-black text-amber-400">香</div>
          <p class="text-white/50 text-sm mt-2">花果香气</p>
        </div>
        <div class="flavor-item">
          <div class="text-3xl md:text-5xl font-black text-amber-400">甘</div>
          <p class="text-white/50 text-sm mt-2">余味悠长</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ====== CTA 收尾 ====== -->
  <section class="cta-section h-screen flex items-center justify-center">
    <div class="text-center px-6">
      <h2 class="cta-title text-4xl md:text-7xl font-black mb-8">
        现在就开一瓶
      </h2>
      <button class="cta-btn px-10 py-4 bg-amber-500 hover:bg-amber-400 transition-colors text-black font-bold rounded-full text-lg">
        立即购买
      </button>
    </div>
  </section>

<script>
  // 注册 ScrollTrigger 插件
  gsap.registerPlugin(ScrollTrigger);

  // ========== 模板1：逐字文字拆分 + 入场动画 ==========
  // 拆分标题文字为单个字符
  document.querySelectorAll(".ad-title, .section-title, .cta-title").forEach(el => {
    const text = el.textContent.trim();
    el.innerHTML = text.split("").map(c => `<span class="char">${c}</span>`).join("");
  });

  // Hero 标题逐字入场
  gsap.from(".ad-title .char", {
    opacity: 0,
    y: 40,
    stagger: 0.08,
    duration: 1,
    ease: "power3.out",
    delay: 0.2
  });

  // 副标题淡入
  gsap.from(".ad-subtitle", {
    opacity: 0,
    y: 20,
    duration: 0.8,
    delay: 0.5,
    ease: "power2.out"
  });

  // 描述文字淡入
  gsap.from(".ad-desc", {
    opacity: 0,
    y: 20,
    duration: 0.8,
    delay: 0.9,
    ease: "power2.out"
  });

  // 滚动提示
  gsap.from(".scroll-hint", {
    opacity: 0,
    y: 10,
    duration: 1,
    delay: 1.5,
    ease: "power2.out"
  });

  // ========== 模板2：产品瓶滚动视差 ==========
  gsap.to(".product-bottle", {
    yPercent: -25,
    rotation: 3,
    ease: "none",
    scrollTrigger: {
      trigger: ".hero-wrap",
      start: "top top",
      end: "bottom top",
      scrub: 1
    }
  });

  // 第二个产品瓶（工艺段）
  gsap.to(".section-block .product-item", {
    yPercent: -15,
    ease: "none",
    scrollTrigger: {
      trigger: ".section-block",
      start: "top bottom",
      end: "bottom top",
      scrub: 0.8
    }
  });

  // ========== 模板3：气泡循环浮动 ==========
  document.querySelectorAll(".bubble").forEach((bubble, i) => {
    gsap.to(bubble, {
      y: -30 - i * 10,
      x: (i % 2 === 0 ? 1 : -1) * 15,
      duration: 2 + i * 0.5,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });
  });

  // ========== 模板4：分段内容滚动渐显 ==========
  gsap.utils.toArray(".section-block").forEach(block => {
    gsap.from(block, {
      opacity: 0,
      y: 60,
      duration: 1,
      ease: "power2.out",
      scrollTrigger: {
        trigger: block,
        start: "top 75%"
      }
    });

    // 段标题逐字动画
    const title = block.querySelector(".section-title");
    if (title) {
      gsap.from(title.querySelectorAll(".char"), {
        opacity: 0,
        y: 30,
        stagger: 0.05,
        duration: 0.8,
        ease: "power3.out",
        scrollTrigger: {
          trigger: block,
          start: "top 70%"
        }
      });
    }
  });

  // ========== 模板5：背景层慢速视差 ==========
  gsap.to(".bg-layer", {
    yPercent: 15,
    ease: "none",
    scrollTrigger: {
      trigger: ".page-container",
      start: "top top",
      end: "bottom bottom",
      scrub: 0.5
    }
  });

  // 风味项依次入场
  gsap.from(".flavor-item", {
    opacity: 0,
    y: 30,
    stagger: 0.15,
    duration: 0.8,
    ease: "power2.out",
    scrollTrigger: {
      trigger: ".flavor-item",
      start: "top 80%"
    }
  });

  // CTA 标题入场
  gsap.from(".cta-title .char", {
    opacity: 0,
    y: 30,
    stagger: 0.06,
    duration: 0.9,
    ease: "power3.out",
    scrollTrigger: {
      trigger: ".cta-section",
      start: "top 70%"
    }
  });

  // CTA 按钮入场
  gsap.from(".cta-btn", {
    opacity: 0,
    y: 20,
    duration: 0.8,
    delay: 0.5,
    ease: "power2.out",
    scrollTrigger: {
      trigger: ".cta-section",
      start: "top 65%"
    }
  });

  // ========== 移动端降级 ==========
  if (window.innerWidth < 768) {
    // 移动端降低视差强度
    gsap.to(".product-bottle", {
      yPercent: -12,
      rotation: 1,
      scrollTrigger: {
        trigger: ".hero-wrap",
        start: "top top",
        end: "bottom top",
        scrub: 1
      }
    });
    // 减少动画数量可以在这里继续做
  }
</script>

</body>
</html>
